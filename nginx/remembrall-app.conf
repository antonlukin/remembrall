server {
    listen 80;
    server_name remembrall.app;
    server_name *.remembrall.app;

    location / {
        return 301 https://$host$request_uri;
    }
}

server  {
    listen 443 ssl;
    server_name remembrall.app;

    ssl_certificate /etc/letsencrypt/live/remembrall.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remembrall.app/privkey.pem;

    charset utf-8;
    root /srv/http/remembrall.app/public;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
